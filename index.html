    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.addEventListener('DOMContentLoaded', () => {

            let v = document.getElementById('room3d')

            const loader = new THREE.TextureLoader();
            let tex = loader.load('./assets/512/abstract-balls/abstract-balls-001.png');
            tex.colorSpace = THREE.SRGBColorSpace;

            let sceneColor = new THREE.Color();
            sceneColor.setHSL(.01, 1.0, 0.5);

            // 1. 初始化場景
            const scene = new THREE.Scene();
            scene.background = sceneColor;

            // 2. 攝影機設定
            const camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000,
            );
            camera.position.set(0, 0, 3);

            // 3. 渲染器設定 (開啟抗鋸齒與物理燈光)
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping; // 提升亮部細節
            v.appendChild(renderer.domElement);

            // 4. 重點：燈光配置
            // 環境光：提供基礎亮度
            const ambientLight = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambientLight);

            // 前置燈光 主燈：製造強烈的高光
            const fillLightMain = new THREE.PointLight(0xffffff, 20); // center
            fillLightMain.position.set(0, 0, 3);
            scene.add(fillLightMain);

            // 背後燈光
            const sublight = new THREE.SpotLight(0xffffff, 50);
            sublight.position.set(0, 0, -5);
            sublight.castShadow = true;
            scene.add(sublight);

            // 補燈：增加側面的輪廓光
            const fillLight = new THREE.PointLight(0xffcc00, 20); // 帶點藍色調
            fillLight.position.set(-5, 0, -2);
            scene.add(fillLight);

            // 補燈：增加側面的輪廓光
            const fillLight2 = new THREE.PointLight(0xffcc00, 20); // 帶點藍色調
            fillLight2.position.set(5, 0, -2);
            scene.add(fillLight2);

            // 5. 創建幾何
            // 展示圖片
            const geometry = new THREE.BoxGeometry(2, 2, 0.02, 1);
            const material = new THREE.MeshPhysicalMaterial({
                roughness: 0.58,
                map: tex,
            });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // 圖片背筐
            const geometry_back = new THREE.BoxGeometry(2, 2, 0.05, 1, 1, 1);
            const material_back = new THREE.MeshStandardMaterial({
                roughness: 0.5,
                color: 0x000000,
            });
            const mesh_back = new THREE.Mesh(geometry_back, material_back);
            mesh_back.position.z = -0.035;
            scene.add(mesh_back);

            // 6. 加上地板以觀察陰影與反射
            const plane = new THREE.Mesh(
                new THREE.PlaneGeometry(10, 10),
                new THREE.MeshStandardMaterial({
                    color: sceneColor,
                    side: THREE.DoubleSide,
                }),
            );
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -2;
            scene.add(plane);

            // 控制器
            const controls = new OrbitControls(camera, renderer.domElement);

            // 動畫迴圈
            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }

            animate();

            // 視窗縮放處理
            function resize() {
                let rect = { width: window.innerWidth, height: window.innerHeight }
                camera.aspect = rect.width / rect.height;
                camera.updateProjectionMatrix();
                renderer.setSize(rect.width, rect.height);
            }

            window.addEventListener('resize', resize);
            resize();

            // close room
            let close = document.querySelector('.close')
            close.addEventListener('pointerup', () => {
                v.classList.toggle('hidden')
                close.classList.toggle('hidden')
            });

            // call room 3d
            [...document.querySelectorAll('.my-painting')].forEach((i, idx) => {
                let imgPath = i.className.split('bg-[url(')[1].split(')]')[0]
                i.addEventListener('pointerup', () => {
                    tex = loader.load(imgPath);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    material.map = tex;
                    v.classList.toggle('hidden')
                    close.classList.toggle('hidden')
                })
                // if (idx == 0) {
                //     i.dispatchEvent(new Event('pointerup'))
                //     close.dispatchEvent(new Event('pointerup'))
                // }
            })

        })
    </script>
